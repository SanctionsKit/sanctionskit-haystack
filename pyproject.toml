[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sanctionskit-haystack"
version = "0.1.0.dev0"
description = "SanctionsKit screening and retained evidence components for Haystack"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "SanctionsKit"}]
dependencies = ["haystack-ai>=3.3,<3.4", "httpx>=0.27,<1", "jsonschema>=4.23,<5"]

[project.urls]
Homepage = "https://www.sanctionskit.com/"
Documentation = "https://www.sanctionskit.com/docs/screenings"

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/sanctionskit_haystack"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "CONTRACT.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
